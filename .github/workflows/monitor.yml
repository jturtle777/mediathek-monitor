name: Mediathek Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mediathek Monitor starten
        run: python monitor.py
